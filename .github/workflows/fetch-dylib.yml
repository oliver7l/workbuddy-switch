name: fetch-swift-dylib
on:
  push:
    branches: [swift-dylib-fetch]
jobs:
  fetch:
    runs-on: macos-15-intel
    steps:
      - run: |
          find /Applications/Xcode*.app -name "libswift_Concurrency.dylib" 2>/dev/null | while read D; do
            echo "=== $D"
            otool -l "$D" 2>/dev/null | grep -E "cmd LC_VERSION_MIN|minos|platform" | head -2
          done
          echo "=== swift 目录结构 ==="
          ls /Applications/Xcode_16.0.0.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/ 2>/dev/null
