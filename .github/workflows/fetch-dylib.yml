name: fetch-swift-dylib
on:
  push:
    branches: [swift-dylib-fetch]
jobs:
  fetch:
    runs-on: macos-15-intel
    steps:
      - run: |
          ls -d /Applications/Xcode*.app 2>/dev/null
          for X in /Applications/Xcode*.app; do
            D="$X/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/macosx/libswift_Concurrency.dylib"
            if [ -f "$D" ]; then
              MINOS=$(otool -l "$D" 2>/dev/null | grep -A3 LC_BUILD_VERSION | grep minos | head -1)
              echo "$X => $MINOS"
            fi
          done
