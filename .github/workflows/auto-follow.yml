name: auto-follow

# 自有更新通道的自动跟进：上游（changexbc/workbuddy-switch）出新版本时，
# 自动合并进 self 分支并打 self 标签触发 build.yml，发布到本 fork 的 Release。
# 本地构建的 App 更新源指向本 fork 的 latest.json，因此「点更新」拿到的
# 永远是「上游最新 + 本地自有功能」的构建。
#
# 合并冲突时自动开 issue，需要手动解冲突后重跑（gh workflow run auto-follow）。

on:
  schedule:
    - cron: "0 2 * * 1" # 每周一 02:00 UTC（北京时间周一 10:00）
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: self
          fetch-depth: 0

      - name: Sync upstream, merge new tag, trigger build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "self-follow-bot"
          git config user.email "bot@users.noreply.github.com"
          git remote add upstream https://github.com/changexbc/workbuddy-switch.git
          git fetch upstream --tags

          LATEST=$(git tag --merged upstream/main --sort=-v:refname -l 'v*' | grep -v -- '-self' | head -1)
          if [ -z "$LATEST" ]; then
            echo "上游没有任何可用 tag，退出"
            exit 0
          fi
          echo "上游最新 tag：$LATEST"

          if git ls-remote --tags origin "refs/tags/${LATEST}-self" | grep -q .; then
            echo "${LATEST}-self 已构建过，无需跟进"
            exit 0
          fi

          if ! git merge --no-edit "$LATEST"; then
            gh issue create \
              --title "auto-follow：合并 $LATEST 冲突，需手动处理" \
              --body "self 分支与 $LATEST 合并冲突。本地执行：git fetch origin --tags && git checkout self && git merge $LATEST，解冲突后 push，再手动打标签 ${LATEST}-self。" || true
            exit 1
          fi

          git push origin self
          git tag "${LATEST}-self"
          git push origin "${LATEST}-self"
          echo "已触发 $LATEST-self 构建（build.yml 按标签自动发布 Release）"
