# Mac mini（Apple Silicon）专用构建线（2026-10-17 两台机器分开）。
# 源码用 macos15-aarch64 分支：上游最新 + 切号覆盖功能，【不带】macos11-x86_64 的
# Tailwind v3 降级等老机补丁（那些只服务 Intel 机的 Safari 14）。
# 触发：v*-own 标签（auto-follow 在合并完两条机器线后统一打）；
# 本工作流发布 aarch64 签名产物到 Release（与 x86_64 文件名互不冲突）。
name: build-macos15-aarch64

on:
  push:
    tags: ["v*-own"]
  workflow_dispatch:

jobs:
  build:
    name: Build aarch64（Mac mini）
    runs-on: macos-14 # Apple Silicon runner，产物为 aarch64-apple-darwin
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      # 源码取 macos15-aarch64 分支最新（auto-follow 保证打标签前已合并上游）
      - uses: actions/checkout@v4
        with:
          ref: macos15-aarch64

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - run: npm ci

      # 完整链路：companion(npm ci + vite + cargo release) → 主前端 tsc+vite → tauri release → fix-app.sh
      - name: Build app (release)
        run: npm run build:app:release

      - name: Package app
        run: |
          cd target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent workbuddy-switch.app workbuddy-switch-macos15-aarch64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: workbuddy-switch-macos15-aarch64
          path: target/release/bundle/macos/workbuddy-switch-macos15-aarch64.zip
          retention-days: 14

      - name: Prepare updater assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          mkdir -p dist-bin
          BUNDLE="target/release/bundle/macos"
          ARCHIVE=$(find "$BUNDLE" -maxdepth 1 -type f -name '*.app.tar.gz' | sort | head -1)
          test -f "$ARCHIVE" && test -f "$ARCHIVE.sig"
          cp "$ARCHIVE" dist-bin/workbuddy-switch-macos-aarch64.app.tar.gz
          cp "$ARCHIVE.sig" dist-bin/workbuddy-switch-macos-aarch64.app.tar.gz.sig
          VER=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)
          UPDATE_VERSION="$VER" UPDATE_OS=macos UPDATE_ARCH=aarch64 \
            sh scripts/gen-update-json.sh oliver7l workbuddy-switch
          cp latest-macos-aarch64.json dist-bin/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-bin/workbuddy-switch-macos15-aarch64.zip
            dist-bin/workbuddy-switch-macos-aarch64.app.tar.gz
            dist-bin/workbuddy-switch-macos-aarch64.app.tar.gz.sig
            dist-bin/latest-macos-aarch64.json
